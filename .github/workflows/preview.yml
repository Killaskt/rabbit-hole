name: Preview Build (TestFlight)

on:
  pull_request:
    branches: [master]

jobs:
  trigger-codemagic-preview:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger Codemagic preview build
        env:
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
          CODEMAGIC_APP_ID: ${{ secrets.CODEMAGIC_APP_ID }}
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "x-auth-token: $CODEMAGIC_API_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST https://api.codemagic.io/builds \
            -d "{\"appId\":\"$CODEMAGIC_APP_ID\",\"workflowId\":\"ios-feature-preview\",\"branch\":\"${GITHUB_HEAD_REF}\"}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Failed to trigger Codemagic: HTTP $HTTP_CODE"
            echo "$BODY"
            exit 1
          fi
          BUILD_ID=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin)['buildId'])")
          echo "Codemagic preview build started: $BUILD_ID"
          echo "https://codemagic.io/builds/$BUILD_ID"
